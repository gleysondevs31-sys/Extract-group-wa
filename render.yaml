services:
  - type: web
    name: whatsapp-baileys-render-admin
    env: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /api/health
    disk:
      name: whatsapp-persistent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_PATH
        value: /data/auth_info
      - key: EXPORT_PATH
        value: /data/exports
      - key: LOG_PATH
        value: /data/logs
      - key: ADMIN_TOKEN
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-baileys-db
          property: connectionString

databases:
  - name: whatsapp-baileys-db
    plan: starter
    databaseName: whatsapp_admin
    user: whatsapp_admin
